<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Saba Exploit</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- LOADER -->
  <div class="loader">
    <img src="./assets/SEputih.png" alt="Logo Intro" class="loader-logo">
  </div>

  <!-- CURSOR -->
  <div class="cursor"></div>

  <!-- NAV -->
  <nav>
    <div class="logo">
      <img src="./assets/SEputih.png" alt="Logo Saba Exploit" class="nav-logo-img">
    </div>

    <div class="nav-right">
      Scroll to explore
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">

    <div class="hero-grid"></div>

    <div class="hero-image">
      <img src="./assets/SEputih.png" alt="Logo Saba Exploit" class="nav-logo-img">
    </div>

    <div class="hero-content">

      <div class="small-title">
        
      </div>

      <h1 class="hero-title">
        <span>WELCOME</span>
        <span class="outline">TO</span>
        <span class="red-text">SABA EXPLOIT</span>
      </h1>

    </div>

    <div class="scroll-indicator">
      Scroll
      <div class="scroll-line"></div>
    </div>

  </section>

  <!-- INTRO -->
  <section class="intro">
    <div class="intro-container">
      <div class="intro-text">
        <p id="typed-text"></p>
        <span class="cursor-type">|</span>
      </div>

      <div class="intro-image">
        <img src="./assets/SEputih.png" alt="Logo Saba Exploit">
      </div>
    </div>
  </section>

  <!-- STORY -->
  <section class="story">

    <div class="story-sticky">

      <div class="story-image">
        <img src="./assets/Untitled design.png" alt="Memory Image">
      </div>

      <div class="story-title">
        <div>THE</div>
        <div>MEMORY</div>
      </div>

      <div class="story-number">
        01 / 04
      </div>

    </div>

  </section>

  <!-- MARQUEE -->
  <div class="marquee">

    <div class="marquee-inner">

      <span>Tecno • Desain • Programming •</span>
      <span>Cinematography • Photography • Tecno • </span>
      <span>Programming • Cinematography • Desain • </span>

    </div>

  </div>

  <!-- FINAL -->
  <section class="final">

    <div class="final-bg"></div>

    <div class="final-content">

      <div class="final-small">
        End of the journey
      </div>

      <h2 class="final-title">
        <div>WHO</div>
        <div class="stroke">IS THE</div>
        <div>NEXT?</div>
      </h2>

      <a href="#" class="final-button">
        Enter
        <span>→</span>
      </a>

    </div>

  </section>


  <!-- GSAP & PLUGINS (PENTING: Harus urut!) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/TextPlugin.min.js"></script>

  <script>
    // Registrasikan Plugin GSAP
    gsap.registerPlugin(ScrollTrigger, TextPlugin);

    /* =========================
       CUSTOM CURSOR
    ========================= */
    const cursor = document.querySelector(".cursor");

    if (cursor) {
      document.addEventListener("mousemove", (e) => {
        gsap.to(cursor, {
          x: e.clientX,
          y: e.clientY,
          duration: 0.15,
          ease: "power2.out"
        });
      });

      document.querySelectorAll("a, button, .final-button").forEach(link => {
        link.addEventListener("mouseenter", () => {
          gsap.to(cursor, {
            width: 55,
            height: 55,
            background: "#ff4655",
            duration: 0.25
          });
        });

        link.addEventListener("mouseleave", () => {
          gsap.to(cursor, {
            width: 18,
            height: 18,
            background: "transparent",
            duration: 0.25
          });
        });
      });
    }

    /* =========================
       HERO ANIMATION
    ========================= */
    gsap.to(".hero-image", {
      scale: 1.25,
      rotation: -3,
      y: 100,
      scrollTrigger: {
        trigger: ".hero",
        start: "top top",
        end: "bottom top",
        scrub: 1
      }
    });

    gsap.to(".hero-image img", {
      scale: 1,
      scrollTrigger: {
        trigger: ".hero",
        start: "top top",
        end: "bottom top",
        scrub: 1
      }
    });

    gsap.to(".hero-content", {
      y: -180,
      opacity: 0,
      scrollTrigger: {
        trigger: ".hero",
        start: "top top",
        end: "70% top",
        scrub: 1
      }
    });

    gsap.to(".hero-grid", {
      y: -200,
      opacity: 0,
      scrollTrigger: {
        trigger: ".hero",
        start: "top top",
        end: "bottom top",
        scrub: 1
      }
    });

    /* =========================
       INTRO TEXT & TYPING
    ========================= */
    const introText = "Saba ExploiT adalah organisasi teknologi informasi dan kreativitas digital yang didirikan pada tahun 2006 di SMAN 1 Bantul oleh empat siswa Tim Olimpiade Komputer: Faizal Afnan, Fanni Suyuti, Isnawan Ibnu, dan Ghozy Ul-Haq. Komunitas ini dibentuk sebagai wadah siswa untuk mengembangkan keahlian di bidang pemrograman, desain grafis, fotografi, serta sinematografi. Melalui organisasi ini, para anggotanya aktif memelopori kemajuan IT di sekolah, memproduksi karya kreatif secara konsisten.";

    if (document.querySelector("#typed-text")) {
      gsap.to("#typed-text", {
        text: {
          value: introText,
          delimiter: ""
        },
        duration: 8,
        ease: "none",
        scrollTrigger: {
          trigger: ".intro",
          start: "top 75%",
          toggleActions: "play none none reverse"
        }
      });
    }

    if (document.querySelector(".intro-image")) {
      gsap.from(".intro-image", {
        opacity: 0,
        y: 40,
        scale: 0.9,
        duration: 2,
        ease: "power2.out",
        scrollTrigger: {
          trigger: ".intro",
          start: "top 70%"
        }
      });
    }

    /* =========================
       STORY ANIMATION (THE MEMORY)
    ========================= */
    const storyTimeline = gsap.timeline({
      scrollTrigger: {
        trigger: ".story",
        start: "top top",
        end: "bottom bottom",
        scrub: 1
      }
    });

    storyTimeline
      .to(".story-image", {
        scale: 1.15,
        width: "80vw",
        height: "90vh",
        duration: 1
      })
      .to(".story-image img", {
        scale: 1,
        filter: "grayscale(0)",
        duration: 1
      }, "<")
      .to(".story-title", {
        scale: 1.3,
        letterSpacing: "10px",
        duration: 1
      }, "<")
      .to(".story-title", {
        opacity: 0,
        scale: 2,
        duration: 1
      })
      .to(".story-image", {
        scale: 1.5,
        opacity: 0,
        duration: 1
      }, "<");

    /* =========================
       FINAL SECTION (WHO IS THE NEXT?)
    ========================= */
    gsap.from(".final-content", {
      scale: 0.5,
      opacity: 0,
      rotate: -5,
      scrollTrigger: {
        trigger: ".final",
        start: "top 80%",
        end: "center center",
        scrub: 1
      }
    });

    gsap.to(".final-bg", {
      rotation: 30,
      scale: 1.3,
      scrollTrigger: {
        trigger: ".final",
        start: "top bottom",
        end: "bottom top",
        scrub: 2
      }
    });

    /* =========================
       PARALLAX MOUSE
    ========================= */
    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5);
      const y = (e.clientY / window.innerHeight - 0.5);

      gsap.to(".hero-image", {
        x: x * 20,
        y: y * 20,
        duration: 1,
        overwrite: true
      });
    });
  </script>

</body>
</html>
