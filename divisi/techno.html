    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: auto;
        }

        body {
            background-image: radial-gradient(circle at bottom right, #a33030 0.25%, transparent 25%), radial-gradient(circle at top left, #a33030 0.25%, transparent 25%);
            color: white;
            font-family: "Inter", sans-serif;
            overflow-x: hidden;
        }


        #card_anggota {
            height: 420px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;

            box-shadow: 0 4px 10px rgba(205, 75, 75, 0.12);
            cursor: pointer;
        }

        /* Animasi masuk */
        @keyframes masukBawah {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hover */
        #card_anggota:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 24px rgba(205, 30, 30, 0.35);
        }


        #prog_division img {
            display: block;
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        #nama_anggota {
            text-align: center;
            margin: 0;
            height: 70px;
            font-size: 28px;
            padding-top: 20px;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.4;
            letter-spacing: -0.4px;
            color: #F5F5F5;
            margin: 0 0 6px;
        }

        #jabatan_anggota {
            text-align: center;
            opacity: 0.7;
            font-size: 24px;
            padding-top: 0;
            font-family: 'DM Sans', sans-serif;
            font-weight: 400;
            color: #A1A1AA;
        }

        #gen_anggota {
            background-color: rgba(255, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        #bungkus_gen {
            padding: 6px;
            padding-top: 0;
            padding-left: 15px;
        }

        #prog_division {
            width: 100%;
            inline-size: 80%;
            margin: auto;
            padding: 100px;
        }

        .card_anggota_wrap {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 80px;
            animation: masukBawah 0.8s ease-in both;
        }

        #prog_division #judul_divisi {
            margin-bottom: 180px;
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            font-weight: 800;
            text-align: center;
            line-height: 1.1;
        }

        #judul_divisi::after {
            content: "|";
            color: #cd4b4b;
            margin-left: 5px;
            animation: kedip 0.7s steps(1) infinite;
        }

        @keyframes kedip {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 800px) {
            .card_anggota_wrap {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .members-section {
                width: calc(100% - 32px);
            }

            .card_anggota_wrap {
                grid-template-columns: 1fr;
            }

            #nama_anggota {
                letter-spacing: -1px;
            }

            #card_anggota img {
                height: 220px;
            }
        }
    </style>

    <script>


        const judul = document.getElementById("judul_divisi");
        const teks = "TECHNOPRENEURSHIP";

        let index = 0;

        function mulaiTyping() {
            if (!judul || index >= teks.length) return;

            judul.textContent += teks.charAt(index);
            index++;

            setTimeout(mulaiTyping, 180);
        }

        mulaiTyping();

        /* Animasi card saat terlihat ketika scroll */
        const cards = document.querySelectorAll("#card_anggota");

        if ("IntersectionObserver" in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;

                    const card = entry.target;
                    const urutan = [...cards].indexOf(card);

                    card.style.animationDelay = `${(urutan % 4) * 80}ms`;
                    card.classList.add("in-view");

                    observer.unobserve(card);
                });
            }, {
                threshold: 0.12,
                rootMargin: "0px 0px -30px 0px"
            });

            cards.forEach((card) => observer.observe(card));
        } else {
            cards.forEach((card) => card.classList.add("in-view"));
        }


    </script>
